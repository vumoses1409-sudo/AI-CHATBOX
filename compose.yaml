services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tuvantamly
      POSTGRES_USER: tuvantamly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuvantamly -d tuvantamly"]
      interval: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://tuvantamly:${POSTGRES_PASSWORD}@database:5432/tuvantamly
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
